name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watch=false

      - name: Gerar build de produção
        run: npm run build
